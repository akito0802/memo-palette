<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memo Palette.</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f6f2;color:#35332f;font:16px system-ui,sans-serif}main{max-width:960px;margin:auto;padding:24px 16px 100px}h1{letter-spacing:-1px;margin:0}p{white-space:pre-wrap;overflow-wrap:anywhere}button,input,textarea,select{font:inherit;color:inherit;border:0;border-radius:12px;padding:12px;background:white}button{cursor:pointer}input,textarea{width:100%}textarea{min-height:220px;resize:vertical}nav,.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}nav button.active,.primary{background:#35332f;color:white}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}article{padding:16px;border-radius:18px;min-height:150px;cursor:pointer;overflow:hidden}article h3{margin:0;overflow-wrap:anywhere}article p{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}small{opacity:.7}#add{position:fixed;bottom:24px;right:24px;border-radius:50%;width:60px;height:60px;font-size:28px}dialog{border:0;border-radius:24px;width:min(94%,560px);background:#f8f6f2;padding:20px;max-height:90dvh;overflow:auto}dialog::backdrop{background:#0006}label{display:block;margin:10px 0}#colors button{width:32px;height:32px;border:2px solid transparent}#colors button.sel{border-color:#333}.list{grid-template-columns:1fr!important}</style><main><h1>Memo Palette.</h1><small>今日のひらめきを、好きな色で。</small><p id="status">端末内保存 • v0.1.0</p><input id="search" placeholder="メモを検索…"><nav id="nav"></nav><div class="row"><select id="folder"><option value="">すべてのフォルダ</option></select><button id="layout">表示切替</button><button id="export">バックアップ</button><button id="import">復元</button><input type="file" id="file" accept=".json" hidden></div><div id="cards"></div><button class="primary" id="add" aria-label="新規メモ">＋</button></main><dialog id="editor"><form id="form"><div class="row"><button type="button" id="close">閉じる</button><button class="primary" type="submit">保存</button><button type="button" id="remove">削除</button></div><input id="title" placeholder="タイトル"><label>本文<textarea id="body" placeholder="自由に書いてね"></textarea></label><label>フォルダ<input id="category" placeholder="日常、アイデアなど"></label><label>タグ（カンマ区切り）<input id="tags"></label><div class="row" id="colors"></div><label><input style="width:auto" type="checkbox" id="pin"> ピン留め</label><label><input style="width:auto" type="checkbox" id="fav"> お気に入り</label><button type="button" id="check">☐ チェック項目を追加</button></form></dialog><script>
const $=id=>document.getElementById(id),palette=['#fbe9a8','#dcd2f5','#f7d4da','#cde8d8','#d3e6f7','#f7ddc3','#fff','#e5e5e5','#f5c3b2','#bce7e5','#e5edb5','#f0cbea'];let notes=[];try{notes=JSON.parse(localStorage.getItem('memo-palette')||'[]')}catch{}let tab='すべて',current=null,color=palette[0];function save(){try{localStorage.setItem('memo-palette',JSON.stringify(notes));return true}catch(e){alert('保存できませんでした。空き容量を確認してください');return false}}function render(){const f=$('folder').value;$('folder').replaceChildren(new Option('すべてのフォルダ',''));for(const c of new Set(notes.filter(n=>!n.deleted).map(n=>n.category).filter(Boolean)))$('folder').add(new Option(c,c));$('folder').value=f; $('nav').replaceChildren();for(const t of ['すべて','お気に入り','ピン留め','ゴミ箱']){let b=document.createElement('button');b.textContent=t;b.className=t===tab?'active':'';b.onclick=()=>{tab=t;render()};$('nav').append(b)}$('cards').replaceChildren();const q=$('search').value.toLowerCase();for(const n of notes.filter(n=>!!n.deleted===(tab==='ゴミ箱')&&(tab!=='お気に入り'||n.fav)&&(tab!=='ピン留め'||n.pin)&&(!$('folder').value||n.category===$('folder').value)&&[n.title,n.body,n.category,n.tags].join(' ').toLowerCase().includes(q)).sort((a,b)=>Number(b.pin)-Number(a.pin)||b.updated-a.updated)){let a=document.createElement('article');a.style.background=n.color;let h=document.createElement('h3');h.textContent=(n.pin?'📌 ':'')+(n.fav?'★ ':'')+(n.title||'無題');let p=document.createElement('p');p.textContent=n.body;let s=document.createElement('small');s.textContent=[n.category,n.tags].filter(Boolean).join(' · ');a.append(h,p,s);a.onclick=()=>{if(n.deleted){if(confirm('このメモを復元する？')){n.deleted=false;save();render()}else if(confirm('完全に削除する？')){notes=notes.filter(x=>x.id!==n.id);save();render()}}else open(n)};$('cards').append(a)}if(!$('cards').children.length)$('cards').textContent='メモはまだありません。'}
function colors(){$('colors').replaceChildren();for(const c of palette){let b=document.createElement('button');b.type='button';b.style.background=c;b.className=c===color?'sel':'';b.setAttribute('aria-label',c);b.onclick=()=>{color=c;colors()};$('colors').append(b)}}function open(n){current=n||null;color=n?.color||palette[0];for(const k of ['title','body','category','tags'])$(k).value=n?.[k]||'';for(const k of ['pin','fav'])$(k).checked=!!n?.[k];$('remove').hidden=!n;colors();$('editor').showModal()}$('add').onclick=()=>open();$('close').onclick=()=>$('editor').close();$('form').onsubmit=e=>{e.preventDefault();let n={id:current?.id||crypto.randomUUID(),color,updated:Date.now(),deleted:false};for(const k of ['title','body','category','tags'])n[k]=$(k).value;for(const k of ['pin','fav'])n[k]=$(k).checked;notes=notes.filter(x=>x.id!==n.id);notes.push(n);if(save())$('editor').close();render()};$('remove').onclick=()=>{if(current&&confirm('ゴミ箱に移動する？')){current.deleted=true;save();$('editor').close();render()}};$('check').onclick=()=>{$('body').value+='\n☐ ';$('body').focus()};$('search').oninput=render;$('folder').onchange=render;$('layout').onclick=()=>$('cards').classList.toggle('list');$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(notes)],{type:'application/json'}));a.download='memo-palette.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{try{let n=JSON.parse(await $('file').files[0].text());if(!Array.isArray(n)||!n.every(x=>x&&typeof x.id==='string'&&['title','body','category','tags'].every(k=>typeof x[k]==='string')&&palette.includes(x.color)))throw Error();if(confirm('現在のメモにバックアップを追加・統合する？')){let m=new Map(notes.map(x=>[x.id,x]));for(const x of n)if(!m.has(x.id))m.set(x.id,x);notes=[...m.values()];save();render()}}catch{alert('無効なバックアップです')} $('file').value=''};render();
</script></html>
