const $=id=>document.getElementById(id),palette=['#fbe9a8','#dcd2f5','#f7d4da','#cde8d8','#d3e6f7','#f7ddc3','#fff','#e5e5e5','#f5c3b2','#bce7e5','#e5edb5','#f0cbea'];let notes=[];try{notes=JSON.parse(localStorage.getItem('memo-palette')||'[]')}catch{}let tab='すべて',current=null,color=palette[0],draftTimer=null;function save(){try{localStorage.setItem(window.memoKey||'memo-palette',JSON.stringify(notes));window.memoSync?.();return true}catch(e){alert('保存できませんでした。空き容量を確認してください');return false}}function render(){const f=$('folder').value;$('folder').replaceChildren(new Option('すべてのフォルダ',''));for(const c of new Set(notes.filter(n=>!n.deleted).map(n=>n.category).filter(Boolean)))$('folder').add(new Option(c,c));$('folder').value=f; $('nav').replaceChildren();for(const t of ['すべて','お気に入り','ピン留め','ゴミ箱']){let b=document.createElement('button');b.textContent=t;b.className=t===tab?'active':'';b.onclick=()=>{tab=t;render()};$('nav').append(b)}$('cards').replaceChildren();const q=$('search').value.toLowerCase();for(const n of notes.filter(n=>!n.purged&&!!n.deleted===(tab==='ゴミ箱')&&(tab!=='お気に入り'||n.fav)&&(tab!=='ピン留め'||n.pin)&&(!$('folder').value||n.category===$('folder').value)&&[n.title,n.body,n.category,n.tags].join(' ').toLowerCase().includes(q)).sort((a,b)=>Number(b.pin)-Number(a.pin)||b.updated-a.updated)){let a=document.createElement('article');a.style.background=n.color;let h=document.createElement('h3');h.textContent=(n.pin?'📌 ':'')+(n.fav?'★ ':'')+(n.title||'無題');let p=document.createElement('p');paintText(p,n.body);let s=document.createElement('small');s.textContent=[n.category,n.tags].filter(Boolean).join(' · ');a.append(h,p,s);a.onclick=()=>{if(n.deleted){if(confirm('このメモを復元する？')){n.deleted=false;n.updated=Date.now();save();render()}else if(confirm('完全に削除する？')){n.purged=true;n.updated=Date.now();save();render()}}else openNote(n)};$('cards').append(a)}if(!$('cards').children.length)$('cards').textContent='メモはまだありません。'}
function colors(){$('colors').replaceChildren();for(const c of palette){let b=document.createElement('button');b.type='button';b.style.background=c;b.className=c===color?'sel':'';b.setAttribute('aria-label',c);b.onclick=()=>{color=c;colors();scheduleDraft()};$('colors').append(b)}}function openNote(n){clearTimeout(draftTimer);savedRange=null;current=n||null;color=n?.color||palette[0];for(const k of ['title','body','category','tags'])$(k).value=n?.[k]||'';for(const k of ['pin','fav'])$(k).checked=!!n?.[k];$('remove').hidden=!n;colors();paintText($('visualBody'),$('body').value);$('editor').showModal();refreshFormat();previewChecks();$('draftStatus').textContent='変更は自動保存されます'}$('add').onclick=()=>openNote();$('close').onclick=()=>{flushDraft();$('editor').close()};$('form').onsubmit=e=>{e.preventDefault();clearTimeout(draftTimer);let n={id:current?.id||crypto.randomUUID(),color,updated:Date.now(),deleted:false};for(const k of ['title','body','category','tags'])n[k]=$(k).value;for(const k of ['pin','fav'])n[k]=$(k).checked;notes=notes.filter(x=>x.id!==n.id);notes.push(n);if(save())$('editor').close();render()};$('remove').onclick=()=>{if(current&&confirm('ゴミ箱に移動する？')){clearTimeout(draftTimer);current.deleted=true;current.updated=Date.now();save();$('editor').close();render()}};$('check').onclick=()=>{$('body').value+='\n☐ ';paintText(visual,$('body').value);visual.focus();previewChecks();scheduleDraft()};$('search').oninput=render;$('folder').onchange=render;$('layout').onclick=()=>$('cards').classList.toggle('list');$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(notes)],{type:'application/json'}));a.download='memo-palette.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{try{let n=JSON.parse(await $('file').files[0].text());if(!Array.isArray(n)||!n.every(x=>x&&typeof x.id==='string'&&['title','body','category','tags'].every(k=>typeof x[k]==='string')&&palette.includes(x.color)))throw Error();if(confirm('現在のメモにバックアップを追加・統合する？')){let m=new Map(notes.map(x=>[x.id,x]));for(const x of n)if(!m.has(x.id))m.set(x.id,x);notes=[...m.values()];save();render()}}catch{alert('無効なバックアップです')} $('file').value=''};function styleFormat(span,k){span.dataset.format=k;if(k==='bold')span.style.fontWeight='bold';else if(k==='underline')span.style.textDecoration='underline';else if(k==='heading'){span.style.fontWeight='bold';span.style.fontSize='1.35em'}else if(k==='small'||k==='large')span.style.fontSize=k==='small'?'.8em':'1.25em';else span.style.color=k}function paintText(el,value){el.replaceChildren();const stack=[el];const re=/\[(\/?)(bold|underline|heading|small|large|black|red|blue|green|purple)\]/g;let last=0;for(const m of value.matchAll(re)){stack.at(-1).append(document.createTextNode(value.slice(last,m.index)));if(!m[1]){const span=document.createElement('span');styleFormat(span,m[2]);stack.at(-1).append(span);stack.push(span)}else{let i=stack.findLastIndex(x=>x.dataset?.format===m[2]);if(i>0)stack.length=i}last=m.index+m[0].length}stack.at(-1).append(document.createTextNode(value.slice(last)))} const visual=$('visualBody');let savedRange=null;document.addEventListener('selectionchange',()=>{const sel=getSelection();if(sel.rangeCount&&visual.contains(sel.anchorNode)&&visual.contains(sel.focusNode))savedRange=sel.getRangeAt(0).cloneRange()});function refreshFormat(){const sel=getSelection();const range=sel.rangeCount&&visual.contains(sel.anchorNode)&&visual.contains(sel.focusNode)?sel.getRangeAt(0):savedRange;const formats=new Set();let ink='';if(range&&visual.contains(range.commonAncestorContainer)){let n=range.startContainer;if(n.nodeType===3)n=n.parentElement;while(n&&n!==visual){const k=n.dataset?.format;if(k){formats.add(k);if(!ink&&['black','red','blue','green','purple'].includes(k))ink=k}n=n.parentElement}}for(const b of $('formatBar').querySelectorAll('button')){const active=formats.has(b.dataset.format);b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))}const c=$('ink');c.style.color=ink||'#35332f';c.style.borderColor=ink||'transparent';c.options[0].textContent=({black:'黒（標準）',red:'赤',blue:'青',green:'緑',purple:'紫'})[ink]||'文字色'}document.addEventListener('selectionchange',refreshFormat);visual.addEventListener('input',refreshFormat);function serializeVisual(node){if(node.nodeType===3)return node.nodeValue.replace(/\u200b/g,'');if(node.nodeName==='BR')return '\n';let t=Array.from(node.childNodes).map(serializeVisual).join('');const k=node.dataset?.format;if(k)return '['+k+']'+t+'[/'+k+']';if(node!==visual&&['DIV','P'].includes(node.nodeName))return '\n'+t;return t}function syncVisual(){$('body').value=serializeVisual(visual);previewChecks();scheduleDraft()}visual.addEventListener('input',syncVisual);visual.addEventListener('paste',e=>{e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'));syncVisual()});function formatText(k){const prior=savedRange?.cloneRange();visual.focus();const sel=getSelection();if(prior&&visual.contains(prior.commonAncestorContainer)){sel.removeAllRanges();sel.addRange(prior)}if(!sel.rangeCount||!visual.contains(sel.anchorNode))return;const range=sel.getRangeAt(0);const span=document.createElement('span');span.dataset.format=k;if(k==='bold')span.style.fontWeight='bold';else if(k==='underline')span.style.textDecoration='underline';else if(k==='heading'){span.style.fontWeight='bold';span.style.fontSize='1.35em'}else if(k==='small'||k==='large')span.style.fontSize=k==='small'?'.8em':'1.25em';else span.style.color=k;const collapsed=range.collapsed;if(collapsed)span.textContent='\u200b';else span.append(range.extractContents());range.insertNode(span);range.selectNodeContents(span);if(collapsed)range.collapse(false);sel.removeAllRanges();sel.addRange(range);savedRange=range.cloneRange();syncVisual();refreshFormat()}for(const b of $('formatBar').querySelectorAll('button')){b.onpointerdown=e=>e.preventDefault();b.onclick=()=>formatText(b.dataset.format)}$('ink').onchange=()=>{if($('ink').value)formatText($('ink').value);$('ink').value=''};function flushDraft(){clearTimeout(draftTimer);if(!$('editor').open)return;let n={id:current?.id||crypto.randomUUID(),color,updated:Date.now(),deleted:false};for(const k of ['title','body','category','tags'])n[k]=$(k).value;for(const k of ['pin','fav'])n[k]=$(k).checked;if(!current&&!n.title&&!n.body&&!n.category&&!n.tags)return;if(current&&['title','body','category','tags','color','pin','fav'].every(k=>current[k]===n[k]))return;notes=notes.filter(x=>x.id!==n.id);notes.push(n);current=n;$('remove').hidden=false;if(save())$('draftStatus').textContent='端末に自動保存済み';render()}function scheduleDraft(){clearTimeout(draftTimer);$('draftStatus').textContent='保存待ち…';draftTimer=setTimeout(flushDraft,700)}function previewChecks(){paintText($('richPreview'),$('body').value);$('checkPreview').replaceChildren();$('body').value.split('\n').forEach((line,i)=>{if(!/^[☐☑]/.test(line.trim()))return;const l=document.createElement('label'),b=document.createElement('input');b.type='checkbox';b.style.width='auto';b.checked=line.trim().startsWith('☑');b.onchange=()=>{const lines=$('body').value.split('\n');lines[i]=lines[i].replace(/[☐☑]/,b.checked?'☑':'☐');$('body').value=lines.join('\n');paintText(visual,$('body').value);scheduleDraft()};l.append(b,document.createTextNode(' '+line.trim().slice(1)));$('checkPreview').append(l)})}for(const k of ['title','body','category','tags','pin','fav'])$(k).addEventListener('input',()=>{if(k==='body')previewChecks();scheduleDraft()});$('editor').addEventListener('cancel',flushDraft);document.addEventListener('visibilitychange',()=>{if(document.hidden)flushDraft()});render();
