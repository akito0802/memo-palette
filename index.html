<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memo Palette.</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f6f2;color:#35332f;font:16px system-ui,sans-serif}main{max-width:960px;margin:auto;padding:24px 16px 100px}h1{letter-spacing:-1px;margin:0}p{white-space:pre-wrap;overflow-wrap:anywhere}button,input,textarea,select{font:inherit;color:inherit;border:0;border-radius:12px;padding:12px;background:white}button{cursor:pointer}input,textarea{width:100%}textarea{min-height:220px;resize:vertical}nav,.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}nav button.active,.primary{background:#35332f;color:white}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}article{padding:16px;border-radius:18px;min-height:150px;cursor:pointer;overflow:hidden}article h3{margin:0;overflow-wrap:anywhere}article p{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}small{opacity:.7}#add{position:fixed;bottom:24px;right:24px;border-radius:50%;width:60px;height:60px;font-size:28px}dialog{border:0;border-radius:24px;width:min(94%,560px);background:#f8f6f2;padding:20px;max-height:90dvh;overflow:auto}dialog::backdrop{background:#0006}label{display:block;margin:10px 0}#colors button{width:32px;height:32px;border:2px solid transparent}#colors button.sel{border-color:#333}.list{grid-template-columns:1fr!important}</style><main><h1>Memo Palette.</h1><small>今日のひらめきを、好きな色で。</small><p id="status">端末内保存 • v0.2.0</p><div class="row"><button id="login" disabled>Googleログイン</button><button id="logout" hidden>ログアウト</button></div><input id="search" placeholder="メモを検索…"><nav id="nav"></nav><div class="row"><select id="folder"><option value="">すべてのフォルダ</option></select><button id="layout">表示切替</button><button id="export">バックアップ</button><button id="import">復元</button><input type="file" id="file" accept=".json" hidden></div><div id="cards"></div><button class="primary" id="add" aria-label="新規メモ">＋</button></main><dialog id="editor"><form id="form"><div class="row"><button type="button" id="close">閉じる</button><button class="primary" type="submit">保存</button><button type="button" id="remove">削除</button></div><input id="title" placeholder="タイトル"><label>本文<textarea id="body" placeholder="自由に書いてね"></textarea></label><label>フォルダ<input id="category" placeholder="日常、アイデアなど"></label><label>タグ（カンマ区切り）<input id="tags"></label><div class="row" id="colors"></div><label><input style="width:auto" type="checkbox" id="pin"> ピン留め</label><label><input style="width:auto" type="checkbox" id="fav"> お気に入り</label><button type="button" id="check">☐ チェック項目を追加</button></form></dialog><script>
const $=id=>document.getElementById(id),palette=['#fbe9a8','#dcd2f5','#f7d4da','#cde8d8','#d3e6f7','#f7ddc3','#fff','#e5e5e5','#f5c3b2','#bce7e5','#e5edb5','#f0cbea'];let notes=[];try{notes=JSON.parse(localStorage.getItem('memo-palette')||'[]')}catch{}let tab='すべて',current=null,color=palette[0];function save(){try{localStorage.setItem(window.memoKey||'memo-palette',JSON.stringify(notes));window.memoSync?.();return true}catch(e){alert('保存できませんでした。空き容量を確認してください');return false}}function render(){const f=$('folder').value;$('folder').replaceChildren(new Option('すべてのフォルダ',''));for(const c of new Set(notes.filter(n=>!n.deleted).map(n=>n.category).filter(Boolean)))$('folder').add(new Option(c,c));$('folder').value=f; $('nav').replaceChildren();for(const t of ['すべて','お気に入り','ピン留め','ゴミ箱']){let b=document.createElement('button');b.textContent=t;b.className=t===tab?'active':'';b.onclick=()=>{tab=t;render()};$('nav').append(b)}$('cards').replaceChildren();const q=$('search').value.toLowerCase();for(const n of notes.filter(n=>!n.purged&&!!n.deleted===(tab==='ゴミ箱')&&(tab!=='お気に入り'||n.fav)&&(tab!=='ピン留め'||n.pin)&&(!$('folder').value||n.category===$('folder').value)&&[n.title,n.body,n.category,n.tags].join(' ').toLowerCase().includes(q)).sort((a,b)=>Number(b.pin)-Number(a.pin)||b.updated-a.updated)){let a=document.createElement('article');a.style.background=n.color;let h=document.createElement('h3');h.textContent=(n.pin?'📌 ':'')+(n.fav?'★ ':'')+(n.title||'無題');let p=document.createElement('p');p.textContent=n.body;let s=document.createElement('small');s.textContent=[n.category,n.tags].filter(Boolean).join(' · ');a.append(h,p,s);a.onclick=()=>{if(n.deleted){if(confirm('このメモを復元する？')){n.deleted=false;n.updated=Date.now();save();render()}else if(confirm('完全に削除する？')){n.purged=true;n.updated=Date.now();save();render()}}else open(n)};$('cards').append(a)}if(!$('cards').children.length)$('cards').textContent='メモはまだありません。'}
function colors(){$('colors').replaceChildren();for(const c of palette){let b=document.createElement('button');b.type='button';b.style.background=c;b.className=c===color?'sel':'';b.setAttribute('aria-label',c);b.onclick=()=>{color=c;colors()};$('colors').append(b)}}function open(n){current=n||null;color=n?.color||palette[0];for(const k of ['title','body','category','tags'])$(k).value=n?.[k]||'';for(const k of ['pin','fav'])$(k).checked=!!n?.[k];$('remove').hidden=!n;colors();$('editor').showModal()}$('add').onclick=()=>open();$('close').onclick=()=>$('editor').close();$('form').onsubmit=e=>{e.preventDefault();let n={id:current?.id||crypto.randomUUID(),color,updated:Date.now(),deleted:false};for(const k of ['title','body','category','tags'])n[k]=$(k).value;for(const k of ['pin','fav'])n[k]=$(k).checked;notes=notes.filter(x=>x.id!==n.id);notes.push(n);if(save())$('editor').close();render()};$('remove').onclick=()=>{if(current&&confirm('ゴミ箱に移動する？')){current.deleted=true;current.updated=Date.now();save();$('editor').close();render()}};$('check').onclick=()=>{$('body').value+='\n☐ ';$('body').focus()};$('search').oninput=render;$('folder').onchange=render;$('layout').onclick=()=>$('cards').classList.toggle('list');$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(notes)],{type:'application/json'}));a.download='memo-palette.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{try{let n=JSON.parse(await $('file').files[0].text());if(!Array.isArray(n)||!n.every(x=>x&&typeof x.id==='string'&&['title','body','category','tags'].every(k=>typeof x[k]==='string')&&palette.includes(x.color)))throw Error();if(confirm('現在のメモにバックアップを追加・統合する？')){let m=new Map(notes.map(x=>[x.id,x]));for(const x of n)if(!m.has(x.id))m.set(x.id,x);notes=[...m.values()];save();render()}}catch{alert('無効なバックアップです')} $('file').value=''};render();
</script><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,collection,doc,setDoc,onSnapshot,getDocsFromServer} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const app=initializeApp({apiKey:"AIzaSyAssEVnsSr9P5Wy34WrJCdZI3vjB5rTtOA",authDomain:"memo-palette.firebaseapp.com",projectId:"memo-palette",storageBucket:"memo-palette.firebasestorage.app",messagingSenderId:"534098584831",appId:"1:534098584831:web:15ad80a23937b197d618ca"});
const auth=getAuth(app),db=getFirestore(app);let stop=()=>{},epoch=0,known=new Map();const status=t=>$('status').textContent=t+' • v0.2.0';function lock(v){$('add').disabled=v;$('import').disabled=v;$('cards').style.pointerEvents=v?'none':''}
$('login').disabled=false;$('login').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){status('ログイン失敗: '+e.code)}};$('logout').onclick=async()=>{if(confirm('ログアウトする？'))await signOut(auth)};
onAuthStateChanged(auth,async user=>{const e=++epoch;stop();window.memoSync=null;if($('editor').open)$('editor').close();known=new Map();$('login').hidden=!!user;$('logout').hidden=!user;window.memoKey=user?'memo-palette:'+user.uid:'memo-palette';try{notes=JSON.parse(localStorage.getItem(window.memoKey)||'[]')}catch{notes=[]}render();if(!user){lock(false);status('端末内保存');return}lock(true);status('同期準備中');const col=collection(db,'users',user.uid,'notes');try{const snap=await getDocsFromServer(col);if(e!==epoch)return;const merge=new Map(notes.map(n=>[n.id,n]));for(const d of snap.docs){const n=d.data();known.set(d.id,JSON.stringify(n));if(!merge.has(d.id)||n.updated>=merge.get(d.id).updated)merge.set(d.id,n)}let guest=[];try{guest=JSON.parse(localStorage.getItem('memo-palette')||'[]')}catch{}if(guest.length&&!localStorage.getItem(window.memoKey+':imported')&&confirm('端末内のメモをこのアカウントにコピーする？')){for(const n of guest)if(!merge.has(n.id))merge.set(n.id,n);localStorage.setItem(window.memoKey+':imported','1')}notes=[...merge.values()];window.memoSync=()=>{const writes=[];for(const n of notes){const value=JSON.stringify(n);if(known.get(n.id)!==value){known.set(n.id,value);writes.push(setDoc(doc(col,n.id),n).catch(err=>{if(e===epoch){known.delete(n.id);status('同期失敗・端末に保存済み: '+err.code)}throw err}))}}if(writes.length){status('同期中');Promise.all(writes).then(()=>{if(e===epoch)status('クラウド同期済み')}).catch(()=>{})}};save();render();lock(false);stop=onSnapshot(col,{includeMetadataChanges:true},snap=>{if(e!==epoch)return;const m=new Map(notes.map(n=>[n.id,n]));for(const d of snap.docs){const n=d.data();if(!m.has(d.id)||n.updated>=m.get(d.id).updated){m.set(d.id,n);known.set(d.id,JSON.stringify(n))}}notes=[...m.values()];try{localStorage.setItem(window.memoKey,JSON.stringify(notes))}catch{}render();status(snap.metadata.hasPendingWrites?'同期中':snap.metadata.fromCache?'オフライン・端末保存':'クラウド同期済み')},err=>status('同期エラー: '+err.code));}catch(err){if(e!==epoch)return;status('接続失敗: '+err.code+'（再ログインして再試行）');lock(false)}});
</script></html>
